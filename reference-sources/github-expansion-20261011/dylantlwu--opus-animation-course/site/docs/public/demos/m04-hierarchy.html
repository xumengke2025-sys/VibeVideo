<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>M4 · 视觉层级</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// 同样四条信息，三种层级处理。第一眼看哪、第二眼看哪，由「大小 / 对比 / 运动 / 时间」决定。
window.__meta = { duration: 4, fps: 30, width: 1920, height: 1080 };
const W = 1920, H = 1080, ctx = document.getElementById('c').getContext('2d');
const FONT = '"PingFang SC","Noto Sans SC",sans-serif', SERIF = '"Times New Roman",serif';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x, s = 1.6) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const INFO = { big: '4', label: '颗卫星', title: 'GPS 定位至少需要', detail: '未知数：x · y · z · 时钟误差 t' };

function txt(s, x, y, size, color, { weight = 500, font = FONT, alpha = 1, dy = 0 } = {}) {
  if (alpha <= 0) return; ctx.globalAlpha = alpha; ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y + dy); ctx.globalAlpha = 1;
}
function panel(i, title, sub) {
  const x = 40 + i * 627; ctx.fillStyle = '#1a1b20'; ctx.fillRect(x, 140, 600, 820);
  txt(title, x + 30, 210, 34, '#f2efe8', { weight: 700 }); txt(sub, x + 30, 252, 22, '#8d90a0', { weight: 400 });
  return x + 40;
}

window.seek = (t) => {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  txt('同样四条信息：第一眼看到什么？', 40, 90, 44, '#f2efe8', { weight: 700 });

  // ① 无层级：一样大、一样白、同时出现
  let x = panel(0, '① 无层级', '一样大、一样色、同时出现');
  const a = outExpo(range(t, 0.3, 0.9));
  [INFO.title, INFO.big + ' ' + INFO.label, INFO.detail, '来源：GPS 原理'].forEach((s, k) => txt(s, x, 420 + k * 80, 34, '#d8d8d8', { alpha: a }));

  // ② 静态层级：大小 + 对比 + 一个强调色
  x = panel(1, '② 静态层级', '大小、对比、一个强调色');
  const b = outExpo(range(t, 0.3, 0.9));
  txt(INFO.title, x, 400, 34, '#d8d8d8', { alpha: b });
  txt(INFO.big, x, 640, 260, '#ffb347', { weight: 400, font: SERIF, alpha: b });
  txt(INFO.label, x + 170, 640, 64, '#f2efe8', { weight: 600, alpha: b });
  txt(INFO.detail, x, 740, 26, '#8d90a0', { weight: 400, alpha: b });
  txt('来源：GPS 原理', x, 900, 20, '#5d6070', { weight: 400, alpha: b });

  // ③ 运动层级：主角先动、动得最多；配角后到、动得少
  x = panel(2, '③ 运动层级', '主角先动、动得最多；配角后到');
  const k1 = outBack(range(t, 0.3, 0.9)), k2 = outExpo(range(t, 0.9, 1.4)), k3 = outExpo(range(t, 1.4, 1.9)), k4 = outExpo(range(t, 1.9, 2.3));
  ctx.save(); ctx.translate(x + 80, 560); ctx.scale(Math.max(0, k1), Math.max(0, k1));
  txt(INFO.big, -80, 80, 260, '#ffb347', { weight: 400, font: SERIF }); ctx.restore();
  txt(INFO.label, x + 170, 640, 64, '#f2efe8', { weight: 600, alpha: k2, dy: (1 - k2) * 30 });
  txt(INFO.title, x, 400, 34, '#d8d8d8', { alpha: k3, dy: (1 - k3) * 16 });
  txt(INFO.detail, x, 740, 26, '#8d90a0', { weight: 400, alpha: k4 });
  txt('来源：GPS 原理', x, 900, 20, '#5d6070', { weight: 400, alpha: k4 });
};
window.seek(0);
</script></body></html>
