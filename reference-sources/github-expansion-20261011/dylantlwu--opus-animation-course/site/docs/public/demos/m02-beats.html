<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>M2 · 剪在小节线上</title>
<style>html,body{margin:0;height:100%;background:#0d0d12;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
window.__meta = { duration: 8, fps: 30, width: 1920, height: 1080 };
const W = 1920, H = 1080, ctx = document.getElementById('c').getContext('2d');
const FONT = '"PingFang SC","Noto Sans SC",sans-serif';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x, s = 1.8) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);

// ── 节拍网格：所有时间都从这里派生，不写死秒数 ──
const BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4;           // 1 拍 0.5s，1 小节 2s
const beatPos = (t) => t / BEAT;                              // 当前是第几拍（小数）
const pulse = (t, decay = 8) => Math.exp(-decay * ((t % BEAT) / BEAT)); // 每拍一次的「冲击」，拍点=1，随后衰减
const C = ['#ff5a36', '#ffb347', '#5aa9ff', '#3ccf8e'];
const STAGE = { x: 160, y: 80, w: 1600, h: 760 };

// 四个镜头，各 1 小节，剪辑点全部落在小节线（强拍）上
const SHOTS = [
  { start: 0 * BAR, name: '呼吸', draw(lt) {          // 圆随每拍脉动
    const r = 120 + 60 * pulse(lt) + 40 * outExpo(range(lt, 0, 0.4));
    ctx.fillStyle = C[0]; ctx.beginPath(); ctx.arc(W / 2, 460, r, 0, 7); ctx.fill();
  } },
  { start: 1 * BAR, name: '计数', draw(lt) {          // 每拍滑入一个方块
    for (let i = 0; i < 4; i++) {
      const k = outBack(range(lt, i * BEAT, i * BEAT + 0.3));
      ctx.globalAlpha = clamp(k * 3); ctx.fillStyle = C[1];
      ctx.fillRect(460 + i * 270 - (1 - k) * 120, 360, 200, 200);
    }
    ctx.globalAlpha = 1;
  } },
  { start: 2 * BAR, name: '重音', draw(lt) {          // 每拍砸下一个字
    const words = ['剪', '在', '拍', '上'];
    words.forEach((w, i) => {
      const k = outBack(range(lt, i * BEAT, i * BEAT + 0.25), 2.5);
      if (k <= 0) return;
      ctx.save(); ctx.translate(560 + i * 270, 470); ctx.scale(1.6 - 0.6 * k, 1.6 - 0.6 * k);
      ctx.globalAlpha = clamp(k * 2); ctx.fillStyle = C[2]; ctx.font = `800 200px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(w, 0, 0); ctx.restore();
    });
  } },
  { start: 3 * BAR, name: '收束', draw(lt) {          // 四色汇成一点，最后一拍定格
    for (let i = 0; i < 4; i++) {
      const k = outExpo(range(lt, 0, 3 * BEAT));
      const a = (i / 4) * Math.PI * 2 + lt * 2;
      const r = 320 * (1 - k);
      ctx.fillStyle = C[i]; ctx.beginPath();
      ctx.arc(W / 2 + Math.cos(a) * r, 460 + Math.sin(a) * r, 70 - 30 * k + 30 * pulse(lt) * (1 - k), 0, 7); ctx.fill();
    }
  } },
];

function timeline(t) {
  const x0 = 160, x1 = 1760, y = 960, dur = window.__meta.duration, X = (s) => x0 + (x1 - x0) * (s / dur);
  ctx.strokeStyle = '#2b2d37'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  for (let b = 0; b <= dur / BEAT; b++) {
    const isBar = b % 4 === 0, x = X(b * BEAT);
    ctx.strokeStyle = isBar ? '#8d90a0' : '#3a3d48'; ctx.lineWidth = isBar ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(x, y - (isBar ? 26 : 12)); ctx.lineTo(x, y + (isBar ? 26 : 12)); ctx.stroke();
  }
  SHOTS.forEach((s, i) => {                     // 剪辑点：红色三角
    if (i === 0) return;
    const x = X(s.start); ctx.fillStyle = '#ff5a36';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 46); ctx.lineTo(x + 12, y - 46); ctx.lineTo(x, y - 30); ctx.fill();
  });
  ctx.fillStyle = '#f2efe8'; ctx.fillRect(X(t) - 2, y - 40, 4, 80);  // 播放头
  ctx.font = `400 24px ${FONT}`; ctx.fillStyle = '#8d90a0'; ctx.textAlign = 'left';
  ctx.fillText(`${BPM} BPM · 第 ${Math.floor(beatPos(t)) + 1} 拍 · ▼ = 剪辑点（都在小节线上）`, x0, y + 70);
}

window.seek = (t) => {
  ctx.fillStyle = '#0d0d12'; ctx.fillRect(0, 0, W, H);
  const i = Math.min(SHOTS.length - 1, Math.floor(t / BAR));
  const s = SHOTS[i];
  ctx.fillStyle = '#15161d'; ctx.fillRect(STAGE.x, STAGE.y, STAGE.w, STAGE.h);
  ctx.save(); ctx.beginPath(); ctx.rect(STAGE.x, STAGE.y, STAGE.w, STAGE.h); ctx.clip();
  s.draw(t - s.start);
  ctx.restore();
  ctx.font = `600 28px ${FONT}`; ctx.fillStyle = '#8d90a0'; ctx.textAlign = 'left';
  ctx.fillText(`镜头 ${i + 1} / 4 · ${s.name}`, STAGE.x + 30, STAGE.y + 50);
  // 拍点指示灯
  ctx.fillStyle = `rgba(255,90,54,${0.15 + 0.85 * pulse(t, 10)})`;
  ctx.beginPath(); ctx.arc(STAGE.x + STAGE.w - 50, STAGE.y + 40, 14, 0, 7); ctx.fill();
  timeline(t);
};
window.seek(0);
</script></body></html>
