<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>M3 · reads：一次只给一个新信息</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
window.__meta = { duration: 6, fps: 30, width: 1920, height: 1080 };
const W = 1920, H = 1080, ctx = document.getElementById('c').getContext('2d');
const FONT = '"PingFang SC","Noto Sans SC",sans-serif';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x, s = 1.8) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const INK = '#15151a', DIM = '#9a968c', ACC = '#ff5a36', SAT = '#3b6fd8';

// 同一份内容，两种「给信息的顺序」。k 是各元素的出现进度（0→1），由调用方按时间算好传进来
function scene(ox, k) {
  const cx = ox + 480;
  ctx.textAlign = 'center';
  ctx.globalAlpha = k.title; ctx.font = `700 46px ${FONT}`; ctx.fillStyle = INK;
  ctx.fillText('为什么 GPS 至少要 4 颗卫星？', cx, 200 + (1 - k.title) * 20);
  // 地球弧线 + 接收机
  ctx.globalAlpha = k.earth; ctx.strokeStyle = DIM; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx, 1500, 780, Math.PI * 1.3, Math.PI * 1.7); ctx.stroke();
  const rx = cx, ry = 724;
  ctx.fillStyle = ACC; ctx.beginPath(); ctx.arc(rx, ry, 14, 0, 7); ctx.fill();
  // 卫星 + 测距线
  const SATS = [[-300, 330], [-110, 280], [130, 300], [320, 360]];
  SATS.forEach(([dx, y], i) => {
    const s = Math.max(0, k.sats[i]);
    if (s <= 0) return;
    ctx.globalAlpha = clamp(s * 2);
    ctx.strokeStyle = SAT; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(cx + dx, y); ctx.lineTo(cx + dx + (rx - cx - dx) * clamp(s), y + (ry - y) * clamp(s)); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = SAT;
    ctx.save(); ctx.translate(cx + dx, y); ctx.scale(s, s); ctx.fillRect(-18, -18, 36, 36); ctx.restore();
  });
  // 结论：放在地球下方的空白区，不压任何线条（reads 示例自己也得守 reads 规则）
  ctx.globalAlpha = clamp(k.answer); ctx.fillStyle = ACC; ctx.font = `800 120px ${FONT}`;
  ctx.save(); ctx.translate(cx - 170, 900); const a = Math.max(0, k.answer); ctx.scale(a, a); ctx.fillText('4', 0, 0); ctx.restore();
  ctx.globalAlpha = clamp(k.answer); ctx.font = `500 30px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'left';
  ctx.fillText('= 位置 x · y · z', cx - 100, 856); ctx.fillText('+ 接收机时钟误差', cx - 100, 898);
  ctx.globalAlpha = 1;
}

function readsBar(t, R) {
  const x0 = 1010, x1 = 1870, y = 1010, X = (s) => x0 + (x1 - x0) * (s / window.__meta.duration);
  R.forEach(([a, b, name], i) => {
    ctx.fillStyle = i % 2 ? '#e4ddcc' : '#d8d0bc'; ctx.fillRect(X(a), y - 18, X(b) - X(a) - 4, 36);
    ctx.fillStyle = INK; ctx.font = `500 20px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText(name, X(a) + 8, y + 7);
  });
  ctx.fillStyle = ACC; ctx.fillRect(X(t) - 2, y - 30, 4, 60);
}

window.seek = (t) => {
  ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ece6d8'; ctx.fillRect(958, 0, 4, H);
  ctx.textAlign = 'left'; ctx.font = `700 30px ${FONT}`;
  ctx.fillStyle = DIM; ctx.fillText('❌ 一次全给：观众不知道先看哪', 60, 80);
  ctx.fillStyle = ACC; ctx.fillText('✅ 按 reads 依次给：每次只有一个新信息', 1010, 80);

  const all = outExpo(range(t, 0.3, 0.9));               // 左：所有东西同时淡入
  scene(0, { title: all, earth: all, sats: [all, all, all, all], answer: all });

  const R = [[0.2, 1.3, '① 问题'], [1.3, 2.5, '② 一颗=一个距离'], [2.5, 3.7, '③ 再来三颗'], [3.7, 6, '④ 答案 + 停顿']];
  scene(960, {
    title: outExpo(range(t, 0.2, 0.7)),
    earth: outExpo(range(t, 1.3, 1.7)),
    sats: [outBack(range(t, 1.5, 2.1)), ...[0, 1, 2].map((i) => outBack(range(t, 2.5 + i * 0.25, 3.0 + i * 0.25)))],
    answer: outBack(range(t, 3.7, 4.2), 2.2),
  });
  readsBar(t, R);
};
window.seek(0);
</script></body></html>
