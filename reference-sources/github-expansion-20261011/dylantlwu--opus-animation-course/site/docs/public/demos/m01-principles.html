<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>M1 · 预备 / 过冲 / 错开</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
window.__meta = { duration: 3.2, fps: 30, width: 1920, height: 1080 };
const W = 1920, H = 1080, ctx = document.getElementById('c').getContext('2d');
const FONT = '"PingFang SC","Noto Sans SC",sans-serif';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const inOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x, s = 2.2) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const INK = '#15151a', DIM = '#9a968c', ACC = '#ff5a36';

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function label(x, y, a, b) {
  ctx.textAlign = 'left'; ctx.font = `700 30px ${FONT}`; ctx.fillStyle = INK; ctx.fillText(a, x, y);
  ctx.font = `400 22px ${FONT}`; ctx.fillStyle = DIM; ctx.fillText(b, x, y + 34);
}

window.seek = (t) => {
  ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.font = `700 34px ${FONT}`;
  ctx.fillStyle = DIM; ctx.fillText('机械', 760, 90); ctx.fillStyle = ACC; ctx.fillText('有生命', 1460, 90);
  ctx.strokeStyle = '#ddd8cc'; ctx.lineWidth = 2;
  [[0, 400], [0, 700]].forEach(([, y]) => { ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(1860, y); ctx.stroke(); });

  // ① 预备 Anticipation：先往反方向蓄力，再出发
  label(70, 230, '① 预备', 'anticipation');
  const m = inOut(range(t, 0.5, 1.4));
  ctx.fillStyle = DIM; rrect(lerp(470, 950, m), 190, 110, 110, 18);
  const back = Math.sin(Math.PI * range(t, 0.3, 0.75)) * (t < 0.75 ? 1 : 0); // 0.3–0.75s 往回缩
  const go = outExpo(range(t, 0.7, 1.4));
  const sq = 1 - 0.18 * back;                                              // 蓄力时被压扁
  ctx.fillStyle = ACC;
  const ax = lerp(1170, 1650, go) - 40 * back;
  rrect(ax - (110 / sq - 110) / 2, 190 + 110 * (1 - sq), 110 / sq, 110 * sq, 18);

  // ② 过冲与回落 Overshoot & settle：超过目标再回到位
  label(70, 530, '② 过冲', 'overshoot / settle');
  const s1 = inOut(range(t, 0.5, 1.1)), s2 = outBack(range(t, 0.5, 1.1));
  const box = (cx, k, c) => { ctx.fillStyle = c; const s = 150 * k; rrect(cx - s / 2, 555 - s / 2, s, s, 22 * k); };
  box(760, s1, DIM); box(1460, Math.max(0, s2), ACC);

  // ③ 错开 Stagger + 跟随：一起出现 vs 依次落下、尾巴晚一点停
  label(70, 830, '③ 错开', 'stagger / follow-through');
  const HS = [120, 80, 150, 100, 170, 90], BASE = 990;            // 柱状图：底部对齐
  HS.forEach((h, i) => {
    const k1 = inOut(range(t, 0.5, 1.0));                         // 机械：一起长出来
    ctx.fillStyle = DIM; rrect(520 + i * 80, BASE - h * k1, 56, h * k1, 8);
    const k2 = Math.max(0, outBack(range(t, 0.5 + i * 0.08, 1.0 + i * 0.08), 1.6)); // 依次晚 0.08s + 过冲
    ctx.fillStyle = ACC; rrect(1220 + i * 80, BASE - h * k2, 56, h * k2, 8);
  });
  ctx.globalAlpha = 1;
};
window.seek(0);
</script></body></html>
