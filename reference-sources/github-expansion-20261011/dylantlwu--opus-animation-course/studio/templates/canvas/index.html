<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Canvas 模板 · seek(t)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0f13; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ───────── 契约：渲染器与网页播放器只认这两个东西 ─────────
window.__meta = { duration: 6, fps: 30, width: 1920, height: 1080 };

const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');

// ───────── 工具：全部是纯函数 ─────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const range = (t, a, b) => clamp((t - a) / (b - a));          // t 在 [a,b] 内的进度 0→1
const ease = {
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),    // 快到、轻落
  outBack: (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2), // 过冲
};
const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }; // 代替 Math.random

const C = { bg: '#0e0f13', ink: '#f2efe8', accent: '#ff5a36', dim: '#3a3d48' };
const FONT = '"PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif';

// ───────── 镜头表：与 STORYBOARD.md 的 Shots 一一对应 ─────────
// draw(lt, dur, t)：lt = 镜头内时间，dur = 镜头时长，t = 全片时间
const SHOTS = [
  { id: 'A', start: 0, dur: 2.5, draw: shotA },  // 点 → 线：一个点从左飞入，拉出一条线
  { id: 'B', start: 2.5, dur: 3.5, draw: shotB }, // 标题逐字落下，线变成下划线
];

function shotA(lt, dur) {
  const p = ease.outExpo(range(lt, 0.2, 1.2));
  const x = lerp(-80, W / 2, p);
  // 背景粒子：位置只由 hash(i) 和 t 决定，拖动时间轴也不会「重新洗牌」
  for (let i = 0; i < 60; i++) {
    ctx.fillStyle = C.dim;
    const px = hash(i) * W, py = hash(i + 99) * H + Math.sin(lt * 0.8 + i) * 6;
    ctx.fillRect(px, py, 3, 3);
  }
  const lineK = ease.inOutCubic(range(lt, 1.3, dur));
  ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(W / 2 - 400 * lineK, H / 2); ctx.lineTo(W / 2 + 400 * lineK, H / 2); ctx.stroke();
  ctx.fillStyle = C.accent;
  ctx.beginPath(); ctx.arc(x, H / 2, 14 * (1 - lineK) + 3, 0, Math.PI * 2); ctx.fill();
}

function shotB(lt, dur) {
  const title = '代码即动画';
  ctx.font = `700 150px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const total = ctx.measureText(title).width;
  let x0 = W / 2 - total / 2;
  [...title].forEach((ch, i) => {
    const w = ctx.measureText(ch).width;
    const k = ease.outBack(range(lt, 0.1 + i * 0.09, 0.6 + i * 0.09)); // 逐字错开 0.09s
    ctx.globalAlpha = clamp(k * 2);
    ctx.fillStyle = C.ink;
    ctx.fillText(ch, x0 + w / 2, H / 2 - 20 - (1 - k) * 80);
    x0 += w;
  });
  ctx.globalAlpha = 1;
  const u = ease.inOutCubic(range(lt, 0, 0.8));
  ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(W / 2 - 400, lerp(H / 2, H / 2 + 50, u)); ctx.lineTo(W / 2 + 400, lerp(H / 2, H / 2 + 50, u)); ctx.stroke();
  ctx.font = `400 40px ${FONT}`; ctx.fillStyle = C.ink;
  ctx.globalAlpha = range(lt, 1.2, 1.8);
  ctx.fillText('每一帧，都是时间 t 的函数', W / 2, H / 2 + 140);
  ctx.globalAlpha = 1;
}

// ───────── seek(t)：同一个 t 永远画出同一帧 ─────────
window.seek = (t) => {
  const s = SHOTS.findLast((s) => t >= s.start) ?? SHOTS[0];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  s.draw(t - s.start, s.dur, t);
};
window.seek(0);
</script>
</body>
</html>
