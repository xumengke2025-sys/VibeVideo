<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s17-root { position: absolute; inset: 0; }
        #s17-win { left: 110px; top: 200px; width: 1700px; height: 830px; border-radius: 26px; background: #08080a; border: 5px solid var(--k-ink); box-shadow: 0 10px 0 var(--k-ink); overflow: hidden; }
        #s17-chrome { height: 62px; background: #fffaf0; border-bottom: 5px solid var(--k-ink); display: flex; align-items: center; gap: 14px; padding: 0 24px; }
        #s17-chrome i { width: 20px; height: 20px; border-radius: 50%; border: 4px solid var(--k-ink); display: block; }
        #s17-url { margin-left: 18px; width: 620px; height: 38px; border-radius: 19px; border: 4px solid var(--k-ink); background: #f6efdf; font: 500 20px/30px var(--k-mono); color: var(--k-ink); padding: 0 18px; white-space: pre; }
        #s17-signin { margin-left: auto; padding: 4px 16px; border-radius: 999px; border: 3px solid var(--k-ink); font: 500 20px/1.2 var(--k-mono); color: var(--k-ink); }
        #s17-grid { top: 62px; left: 0; right: 0; bottom: 0; background:
          linear-gradient(rgba(245,245,244,.05) 1px, transparent 1px) 0 0 / 40px 40px,
          linear-gradient(90deg, rgba(245,245,244,.05) 1px, transparent 1px) 0 0 / 40px 40px; }
        #s17-page { width: 1920px; height: 1080px; }
        .s17-old { width: 230px; height: 176px; border-radius: 14px; background: #0f0f13; border: 2px solid rgba(245,245,244,.22); overflow: hidden; }
        .s17-old svg { display: block; opacity: .85; }
        .s17-meta { height: 38px; font: 500 16px/38px var(--k-mono); color: #a8a8a3; padding: 0 14px; display: flex; justify-content: space-between; }
        #s17-out { left: 918px; top: 214px; font-size: 20px; padding: 4px 14px; }
        .s17-tip { padding: 14px 20px; border-radius: 16px; background: #fffaf0; border: 4px solid var(--k-ink); box-shadow: 0 7px 0 var(--k-ink); font: 500 22px/1.45 var(--k-mono); color: var(--k-ink); white-space: nowrap; }
        .s17-tip small { display: block; font-size: 16px; color: var(--k-ink-2); }
        .s17-tip em { font-style: normal; display: inline-block; margin-top: 6px; padding: 2px 12px; border-radius: 999px; background: var(--k-accent); color: var(--k-accent-ink); border: 3px solid var(--k-ink); }
        .s17-cur { width: 150px; height: 90px; }
      </style>
      <div id="s17-root" data-composition-id="s17-share" data-width="1920" data-height="1080">
        <div id="s17-scene" class="k-scene k-warm">
          <div id="s17-win" class="k-abs">
            <div id="s17-chrome"><i></i><i></i><i></i><div id="s17-url"></div><div id="s17-signin">sign in</div></div>
            <div id="s17-grid" class="k-abs"></div>
          </div>
          <div id="s17-out" class="k-pill k-amber">signed out</div>
          <div id="s17-skel" class="k-abs"></div>
          <div id="s17-page" class="k-abs"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const scene = document.getElementById("s17-scene");
          K.grain(scene, "s17");
          K.chrome(scene, tl, { title: "anyone can open the space", chapter: "7 · share", step: 7 });

          // The space, as a signed-out visitor sees it. Everything on the page is still once loaded.
          const page = document.getElementById("s17-page");
          // Before the page loads: its skeleton, where the cards will be.
          const skel = document.getElementById("s17-skel");
          [[300, 340, 230, 176], [734, 394, 280, 238], [1190, 300, 230, 176], [1200, 600, 230, 176], [1540, 430, 230, 176], [135, 297, 64, 300], [240, 286, 360, 20]].forEach(([x, y, w, h]) =>
            K.el(skel, "div", { class: "k-abs", style: { left: x + "px", top: y + "px", width: w + "px", height: h + "px", borderRadius: "14px", background: "rgba(245,245,244,.06)" } }));
          const art = (mood, boat) => `<svg width="230" height="138" viewBox="24 24 172 104" preserveAspectRatio="xMidYMid slice">${K.harbourArt({ boat, mood })}</svg>`;
          const old = (x, y, svg, kind, cr) => K.el(page, "div", { class: "k-abs s17-old", "data-layout-allow-overflow": "", style: { left: x + "px", top: y + "px" } },
            `${svg}<div class="s17-meta"><span>${kind}</span><span>${cr}</span></div>`);
          const seg = (x0, x1, mood, boat, k) => `<clipPath id="s17-seg${k}"><rect x="${x0}" y="24" width="${x1 - x0}" height="104"/></clipPath><g clip-path="url(#s17-seg${k})">${K.harbourArt({ boat, mood })}</g>`;
          const cutSvg = `<svg width="230" height="138" viewBox="24 24 172 104" preserveAspectRatio="xMidYMid slice">${seg(24, 82, "day", -14, 0) + seg(82, 139, "dusk", 30, 1) + seg(139, 196, "night", 70, 2)}<path d="M82 24 V128 M139 24 V128" stroke="#2a2118" stroke-width="3"/></svg>`;
          K.el(page, "svg", { class: "k-abs", width: 1920, height: 1080, style: { pointerEvents: "none" } },
            ["M530 420 C 600 420, 650 500, 736 500", "M1014 480 C 1090 480, 1130 390, 1190 390", "M1014 560 C 1100 560, 1130 690, 1200 690",
             "M1420 390 C 1470 390, 1480 500, 1540 500", "M1430 690 C 1480 690, 1490 540, 1540 540"]
              .map((d) => `<path d="${d}" stroke="rgba(245,245,244,.3)" stroke-width="2.5" fill="none"/>`).join(""));
          old(300, 340, art("day", -30), "still", "3 cr");
          old(1190, 300, art("dusk", 20), "clip", "40 cr");
          old(1200, 600, art("night", 50), "frame", "0 cr");
          old(1540, 430, cutSvg, "cut", "0 cr");
          K.el(page, "div", { class: "k-abs k-mono", style: { left: "560px", top: "468px", padding: "3px 10px", borderRadius: "999px", background: "#1a1a20", color: "#a8a8a3", fontSize: "14px" } }).textContent = "start_frame";
          K.el(page, "div", { class: "k-abs k-mono", style: { left: "240px", top: "286px", fontSize: "18px", color: "#a8a8a3" } }).textContent = "Salt Harbour, Low Tide · demo space";
          // Canvas furniture: tool rail, zoom, minimap.
          K.el(page, "div", { class: "k-abs", style: { left: "135px", top: "297px", width: "64px", height: "300px", borderRadius: "16px", background: "#0f0f13", border: "2px solid rgba(245,245,244,.18)" } },
            [0, 1, 2, 3, 4].map((i) => `<div style="position:absolute;left:16px;top:${18 + i * 56}px;width:28px;height:28px;border-radius:8px;border:2px solid rgba(245,245,244,${i === 0 ? ".8" : ".3"})"></div>`).join(""));
          K.el(page, "div", { class: "k-abs k-mono", style: { left: "1655px", top: "285px", padding: "6px 14px", borderRadius: "10px", background: "#0f0f13", border: "2px solid rgba(245,245,244,.18)", color: "#a8a8a3", fontSize: "16px" } }).textContent = "− 100% +";
          K.el(page, "div", { class: "k-abs", style: { left: "1580px", top: "840px", width: "200px", height: "130px", borderRadius: "12px", background: "#0f0f13", border: "2px solid rgba(245,245,244,.18)" } },
            [[20, 30], [70, 40], [110, 20], [110, 70], [150, 44]].map(([x, y], i) => `<div style="position:absolute;left:${x}px;top:${y}px;width:${i === 1 ? 26 : 22}px;height:16px;border-radius:3px;background:${i === 1 ? "#f2c14e" : "rgba(245,245,244,.3)"}"></div>`).join("") +
            '<div style="position:absolute;left:8px;top:10px;width:176px;height:106px;border:1.5px solid rgba(245,245,244,.4);border-radius:6px"></div>');

          // The protagonist, landed, at the centre of the space.
          const S = 1.4, CL = 720, CT = 380;
          const cx = CL + 110 * S, thumbY = CT + 76 * S;
          const card = K.card(page, { id: "s17-card", theme: "warm", left: CL, top: CT, scale: S, thumb: K.harbourArt({ boat: 12 }) });
          gsap.set(K.part(card, "k-bar"), { opacity: 0 });

          // Visitors are cursors; they slide in from outside the canvas, which clips them until they arrive. One already rests on the frame; two arrive.
          const cursor = (x, y, label) => K.el(page, "div", { class: "k-abs s17-cur", style: { left: x + "px", top: y + "px" } },
            `<svg width="40" height="48" viewBox="0 0 40 48"><path d="M4 3 L4 38 L14 29 L21 44 L28 41 L21 26 L34 26 Z" fill="#fffaf0" stroke="#2a2118" stroke-width="3.5" stroke-linejoin="round"/></svg><div class="k-pill" style="left:30px;top:40px;font-size:16px;padding:3px 10px">${label}</div>`);
          cursor(1340, 650, "visitor");
          const v1 = cursor(420, 400, "visitor"), v2 = cursor(930, 520, "visitor");

          // Recipe cards: what a visitor sees on hover.
          const tip = (x, y, html) => K.el(page, "div", { class: "k-abs s17-tip", style: { left: x + "px", top: y + "px" } }, html);
          const tA = tip(250, 560, "<small>recipe</small>image/flux-2<div><em>3 cr</em></div>");
          const tB = tip(560, 700, `<small>recipe · video/h3-max · 480p · 8 s</small>camera flight over the harbour<div>at low tide <em>80 cr</em></div>`);
          const tC = tip(1150, 810, "<small>recipe</small>image/frame <em>0 cr</em>");

          // b0: the space's link, pasted
          const url = document.getElementById("s17-url"), LINK = "makefx.app/alv/salt-harbour", u = { n: 0 };
          tl.fromTo(u, { n: 0 }, { n: LINK.length, duration: 0.2, ease: "none", onUpdate: () => (url.textContent = LINK.slice(0, Math.round(u.n))) }, K.t(0));
          // b1: no account: it opens signed out
          tl.fromTo("#s17-out", { opacity: 0, scale: 0.4, x: -30 }, { opacity: 1, scale: 1, x: 0, duration: 0.22, ease: "back.out(2.6)" }, K.t(1));
          // b2: the space loads, top to bottom
          tl.fromTo(page, { clipPath: "inset(267px 115px 813px 115px)" }, { clipPath: "inset(267px 115px 55px 115px)", duration: 0.22, ease: "power2.out" }, K.t(2));
          // b3: a visitor arrives on the first still
          tl.fromTo(v1, { x: -470, y: 160 }, { x: 0, y: 0, duration: 0.2, ease: "power3.out" }, K.t(3));
          // b4: its recipe and price show
          K.pop(tl, tA, 4, { from: 0.6, origin: "30% 0%" });
          // b5: another visitor arrives on the film
          tl.fromTo(v2, { x: 100, y: 520 }, { x: 0, y: 0, duration: 0.2, ease: "power3.out" }, K.t(5));
          // b6: the film's recipe and price show
          K.pop(tl, tB, 6, { from: 0.6, origin: "50% 0%" });
          // b7: and the frame's, under the visitor already there
          K.pop(tl, tC, 7, { from: 0.6, origin: "30% 0%" });
          K.sparkle(tl, scene, 1440, 810, K.t(7) + 0.08, { r: 40, n: 2, seed: 17 });

          K.focus(scene, tl, "s17", [
            [0, 560, 236], [1, 990, 236], [2, 860, 440], [3, 450, 430],
            [4, 380, 620], [5, 950, 550], [6, 840, 780], [7, 1260, 850],
          ]);
          K.check(tl, "s17");
          window.__timelines["s17-share"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
