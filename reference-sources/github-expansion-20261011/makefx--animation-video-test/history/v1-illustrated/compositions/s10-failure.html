<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s10-root { position: absolute; inset: 0; }
        #s10-desk { left: 40px; top: 880px; width: 1840px; height: 40px; border-radius: 12px; background: #d9b98a; border: 5px solid var(--k-ink); }
        #s10-desk-front { left: 80px; top: 916px; width: 1760px; height: 164px; background: #c9a877; border-left: 5px solid var(--k-ink); border-right: 5px solid var(--k-ink); }
        .s10-meta { font: 500 22px/1 var(--k-mono); color: #2a2118; }
        #s10-board { left: 110px; top: 200px; padding: 10px 20px; border-radius: 14px; background: #fffaf0; border: 4px solid var(--k-ink); box-shadow: 0 6px 0 var(--k-ink); font: 500 22px/1.2 var(--k-mono); color: var(--k-ink); white-space: nowrap; }
        #s10-board b { font-weight: 500; color: var(--k-ink-2); }
        #s10-ready { left: 244px; top: 524px; }
        #s10-chip-a, #s10-chip-b { left: 740px; top: 484px; }
        #s10-chip-b { background: var(--k-danger); color: var(--k-ink); }
        #s10-err { left: 900px; top: 490px; font: 500 22px/1.2 var(--k-mono); color: var(--k-ink); white-space: pre; }
        #s10-env { left: 1066px; top: 700px; width: 124px; height: 86px; }
        .s10-coin { width: 46px; height: 46px; }
        #s10-jar svg { display: block; }
        #s10-jar { left: 1380px; top: 410px; width: 360px; height: 470px; }
        #s10-label { left: 1440px; top: 540px; width: 240px; height: 116px; border-radius: 12px; background: #fffaf0; border: 4px solid var(--k-ink); text-align: center; }
        #s10-label-k { margin-top: 14px; font: 500 20px/1 var(--k-mono); color: var(--k-ink-2); }
        #s10-bal { margin-top: 12px; font: 600 42px/1 var(--k-display); color: var(--k-ink); white-space: pre; }
        #s10-refund { left: 1436px; top: 372px; font-size: 22px; }
      </style>
      <div id="s10-root" data-composition-id="s10-failure" data-width="1920" data-height="1080">
        <div id="s10-scene" class="k-scene k-warm">
          <div id="s10-desk-front" class="k-abs"></div>
          <div id="s10-desk" class="k-abs"></div>
          <div id="s10-board" class="k-abs"><b>space</b> · alv/salt-harbour</div>
          <div id="s10-m1" class="k-abs s10-meta" style="left:216px;top:950px">8 s · 480p · 80 cr</div>
          <div id="s10-m2" class="k-abs s10-meta" style="left:790px;top:950px">4 s · 480p · 40 cr</div>
          <div id="s10-m3" class="k-abs s10-meta" style="left:1450px;top:950px">1 credit = €0.01</div>
          <div id="s10-jar" class="k-abs"></div>
          <div id="s10-label" class="k-abs"><div id="s10-label-k">balance</div><div id="s10-bal">1,880 cr</div></div>
          <div id="s10-ready" class="k-pill k-amber">ready</div>
          <div id="s10-chip-a" class="k-pill">generating</div>
          <div id="s10-chip-b" class="k-pill">failed</div>
          <div id="s10-err" class="k-abs"></div>
          <div id="s10-refund" class="k-pill k-amber">refunded · 40 cr</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const scene = document.getElementById("s10-scene");
          K.grain(scene, "s10");
          K.cloud(scene, 640, 200, 0.7); K.cloud(scene, 1120, 190, 0.9); K.cloud(scene, 1560, 240, 0.6); K.cloud(scene, 320, 330, 0.5);
          K.plant(scene, 1748, 712, 0.95);
          K.mug(scene, 560, 782);
          K.chrome(scene, tl, { title: "a failure costs nothing", chapter: "4 · land", step: 4 });

          // The protagonist, landed and healthy; it stays still this scene.
          const P = 1.45, PL = 200, PT = 880 - 202 * P;
          K.card(scene, { id: "s10-hero", theme: "warm", left: PL, top: PT, scale: P, thumb: K.harbourArt({ boat: 12 }) });
          gsap.set(K.part(document.getElementById("s10-hero"), "k-bar"), { opacity: 0 });

          // The sibling: a second clip in the same space, still generating.
          const S = 1.7, CL = 700, CT = 880 - 202 * S;
          const cx = CL + 110 * S, thumbY = CT + 76 * S, barY = CT + 125 * S, faceY = CT + 152 * S;
          const card = K.card(scene, { id: "s10-sib", theme: "warm", left: CL, top: CT, scale: S, thumb: K.harbourArt({ boat: -30, mood: "dusk" }) });
          const svg = card.querySelector("svg"), bar = K.part(card, "k-bar"), eyes = K.part(card, "k-eyes");
          const thumb = K.part(card, "k-thumb"), body = K.part(card, "k-body"), mouth = K.part(card, "k-mouth");
          gsap.set(bar, { scaleX: 0.7, transformOrigin: "0 50%" });
          gsap.set(eyes, { scaleY: 0.15, transformOrigin: "50% 50%" });
          // The crack, inside the thumbnail's clip, and the X eyes for later.
          const clipG = svg.querySelector("g[clip-path]");
          const crackW = K.el(clipG, "path", { d: "M156 24 L140 56 L156 70 L124 98 L136 110 L112 130", fill: "none", stroke: "#fffaf0", "stroke-width": 9, "stroke-linejoin": "round" });
          const crack = K.el(clipG, "path", { d: "M156 24 L140 56 L156 70 L124 98 L136 110 L112 130", fill: "none", stroke: "#2a2118", "stroke-width": 4.5, "stroke-linejoin": "round" });
          const xs = K.el(K.part(card, "k-face"), "g", { stroke: "#2a2118", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 });
          xs.innerHTML = '<path d="M86 145 l12 12 M98 145 l-12 12"/><path d="M122 145 l12 12 M134 145 l-12 12"/>';

          // The envelope that rode with it since pricing: 40 cr, sealed.
          const env = document.getElementById("s10-env") || K.el(scene, "div", { id: "s10-env", class: "k-abs" });
          env.innerHTML = `<svg width="124" height="86" viewBox="0 0 124 86" overflow="visible">
            <rect x="4" y="12" width="116" height="70" rx="8" fill="#f2c14e" stroke="#2a2118" stroke-width="4"/>
            <path d="M6 16 L62 52 L118 16" fill="none" stroke="#2a2118" stroke-width="4" stroke-linejoin="round"/>
            <g id="s10-flap"><path d="M6 14 L62 52 L118 14 Z" fill="#e8b73f" stroke="#2a2118" stroke-width="4" stroke-linejoin="round"/></g>
            <circle id="s10-seal" cx="62" cy="50" r="12" fill="#f0655a" stroke="#2a2118" stroke-width="3.5"/>
            <text x="86" y="76" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#1a1300">40 cr</text></svg>`;
          gsap.set(env, { rotation: 8 });
          scene.appendChild(env);

          // The balance jar: glass, a lid, coins already in it.
          document.getElementById("s10-jar").innerHTML = `<svg width="360" height="470" viewBox="0 0 300 392">
            <rect x="54" y="34" width="192" height="26" rx="10" fill="#e8dcc0" stroke="#2a2118" stroke-width="5"/>
            <path d="M70 58 H230 Q286 70 286 140 V350 Q286 386 250 386 H50 Q14 386 14 350 V140 Q14 70 70 56 Z" fill="#fffaf0" fill-opacity=".7" stroke="#2a2118" stroke-width="5"/>
            <g fill="#f2c14e" stroke="#2a2118" stroke-width="4">
              ${[[60, 360], [104, 364], [150, 362], [196, 364], [240, 360], [82, 334], [128, 338], [174, 336], [220, 334], [104, 310], [152, 312], [198, 308]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="24" ry="11"/>`).join("")}
            </g>
            <path d="M40 110 Q34 170 40 230" stroke="#fffaf0" stroke-width="9" fill="none" stroke-linecap="round"/><rect x="54" y="34" width="192" height="26" rx="10" fill="#e8dcc0" stroke="#2a2118" stroke-width="5"/></svg>`;
          scene.appendChild(document.getElementById("s10-label"));

          // Coins: they leave the envelope, arc over, and drop into the jar.
          const coinArt = '<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="#f2c14e" stroke="#2a2118" stroke-width="4"/><circle cx="23" cy="23" r="11" fill="none" stroke="#b8871f" stroke-width="4"/></svg>';
          const JX = 1560, JY = 772; // on top of the pile, below the label
          const coins = [0, 1, 2].map((i) => {
            const c = K.el(scene, "div", { class: "k-abs s10-coin" }, coinArt);
            const path = K.el(scene, "svg", { class: "k-abs", width: 1920, height: 1080, style: { visibility: "hidden" } },
              `<path d="M${1124 + i * 8} 736 C ${1200 + i * 16} ${380 - i * 16}, ${JX - 30 + i * 30} ${300 - i * 10}, ${JX - 44 + i * 44} ${JY + (i % 2) * 8}"/>`).querySelector("path");
            return { c, path, L: path.getTotalLength() };
          });
          // the coins fall behind the jar's label
          scene.appendChild(document.getElementById("s10-label"));
          scene.appendChild(document.getElementById("s10-refund"));
          const ride = (coin, u0, u1, at, dur, ease, follow) => {
            const p = { u: u0 };
            const place = () => { const q = coin.path.getPointAtLength(coin.L * p.u); coin.c.style.transform = `translate(${q.x - 23}px, ${q.y - 23}px)`; };
            tl.fromTo(p, { u: u0 }, { u: u1, duration: dur, ease, onUpdate: place, data: follow ? "follow" : undefined }, at);
            place();
          };

          // b0: the sibling's progress stalls and goes red
          tl.fromTo(bar, { attr: { fill: "#f2c14e" } }, { attr: { fill: "#f0655a" }, duration: 0.06 }, K.t(0));
          tl.fromTo(bar, { opacity: 1 }, { opacity: 0.25, duration: 0.05, yoyo: true, repeat: 3, data: "follow" }, K.t(0) + 0.06);
          // b1: the picture cracks
          K.draw(tl, crackW, 1, 0.16, "power3.out");
          K.draw(tl, crack, 1, 0.16, "power3.out");
          tl.fromTo(card, { x: 0 }, { x: 6, duration: 0.04, yoyo: true, repeat: 3, data: "follow" }, K.t(1));
          // b2: it greys out; X eyes
          tl.fromTo(thumb, { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(1) brightness(0.9)", duration: 0.18 }, K.t(2));
          tl.fromTo(body, { fill: "#fffaf0" }, { fill: "#e4dccb", duration: 0.18, data: "follow" }, K.t(2));
          tl.to(eyes, { opacity: 0, duration: 0.04, data: "follow" }, K.t(2));
          tl.fromTo(xs, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(3)", data: "follow" }, K.t(2) + 0.02);
          tl.set(mouth, { attr: { d: "M103 166 q7 -6 14 0" }, data: "follow" }, K.t(2) + 0.04);
          tl.to(card, { y: 8, rotation: -2, transformOrigin: "50% 100%", duration: 0.2, ease: "power2.out", data: "follow" }, K.t(2));
          // b3: status flips to failed, with its short error
          tl.fromTo("#s10-chip-b", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.6)" }, K.t(3));
          tl.to("#s10-chip-a", { opacity: 0, scale: 0.6, duration: 0.1, data: "follow" }, K.t(3));
          K.type(tl, document.getElementById("s10-err"), "provider_timeout", 3.5, 0.12);
          // b4: the envelope unseals
          tl.fromTo("#s10-seal", { scale: 1, opacity: 1, transformOrigin: "50% 50%" }, { scale: 1.6, opacity: 0, duration: 0.1 }, K.t(4));
          tl.fromTo("#s10-flap", { scaleY: 1, transformOrigin: "50% 12%" }, { scaleY: -1, duration: 0.16, ease: "back.out(2)", data: "follow" }, K.t(4) + 0.04);
          // b5: the coins rise out and arc toward the jar
          coins.forEach((coin, i) => {
            tl.fromTo(coin.c, { opacity: 0 }, { opacity: 1, duration: 0.03, data: i ? "follow" : undefined }, K.t(5) + i * 0.04);
            ride(coin, 0, 0.62, K.t(5) + i * 0.04, 0.22, "power2.out", i > 0);
          });
          // b6: they drop into the jar
          coins.forEach((coin, i) => {
            ride(coin, 0.62, 1, K.t(6) + i * 0.04, 0.14, "power2.in", i > 0);
            tl.to(coin.c, { scaleY: 0.5, duration: 0.05, data: "follow" }, K.t(6) + 0.14 + i * 0.04);
          });
          K.sparkle(tl, scene, JX, 790, K.t(6) + 0.16, { r: 60, n: 3, seed: 10 });
          // b7: the balance is whole again
          const bal = document.getElementById("s10-bal"), n = { v: 1880 };
          tl.fromTo(n, { v: 1880 }, { v: 1920, duration: 0.16, ease: "power2.out", onUpdate: () => (bal.textContent = Math.round(n.v).toLocaleString("en-US") + " cr") }, K.t(7));
          K.pop(tl, "#s10-refund", 7, { origin: "50% 100%" });

          K.focus(scene, tl, "s10", [
            [0, cx, barY], [1, cx + 20, thumbY], [2, cx, faceY], [3, 860, 504],
            [4, 1126, 742], [5, 1330, 470], [6, JX, 700], [7, JX, 520],
          ]);
          K.check(tl, "s10");
          window.__timelines["s10-failure"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
