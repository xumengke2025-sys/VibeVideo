<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Nunito:wght@700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f3ead6; }
      #root { position: relative; width: 1920px; height: 1080px; }
      #scene { position: absolute; inset: 0; }
      #paper { position: absolute; inset: 0; }
      .abs { position: absolute; left: 0; top: 0; }

      /* chrome */
      #title { left: 72px; top: 62px; font: 800 30px Nunito, sans-serif; color: #3b2b25; white-space: pre; }
      #title-line { left: 72px; top: 106px; width: 330px; height: 5px; border-radius: 3px; background: #f2c14e; transform-origin: 0 50%; }
      #ring { left: 1756px; top: 56px; width: 64px; height: 64px; }
      #ring-label { left: 1728px; top: 128px; width: 120px; text-align: center; font: 500 16px 'JetBrains Mono', monospace; color: #6a5b4e; }

      /* DOM node labels */
      .tag {
        position: absolute; left: 0; top: 0; padding: 5px 14px; border-radius: 999px;
        background: #fffaf0; border: 3px solid #3b2b25; box-shadow: 0 3px 0 #3b2b25;
        font: 500 20px 'JetBrains Mono', monospace; color: #3b2b25; white-space: nowrap;
        transform: translate(-50%, -50%);
      }
      .tag.text { background: #fde7ec; font-size: 18px; }

      .callout { font: 800 24px Nunito, sans-serif; color: #3b2b25; white-space: nowrap; }
      #badge {
        left: 1648px; top: 512px; width: 38px; height: 38px; border-radius: 50%;
        background: #c2363b; border: 3px solid #3b2b25; display: grid; place-items: center;
        color: #fff; font: 800 16px Nunito, sans-serif; letter-spacing: -2px;
      }
      .puff { width: 46px; height: 46px; border-radius: 50%; background: #fffdf7; border: 3px solid #3b2b25; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #3b2b25; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <!-- Everything painted per frame: stripes, grain, basket, vines, leaves, flowers -->
        <canvas id="paper" width="1920" height="1080"></canvas>

        <!-- Node labels, positioned by script from the same tree the canvas draws -->
        <div id="tags"></div>

        <!-- Callout line to the script tag -->
        <svg class="abs" width="1920" height="1080" viewBox="0 0 1920 1080">
          <path id="callout-line" d="M1668 552 C 1672 590, 1684 620, 1704 640" fill="none" stroke="#3b2b25" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" />
        </svg>
        <div id="callout-paused" class="abs callout" style="left:1712px;top:630px">parser paused</div>
        <div id="callout-resumes" class="abs callout" style="left:1712px;top:630px">parser resumes</div>
        <div id="badge" class="abs">❚❚</div>

        <!-- Toaster: the script that runs while the parser waits -->
        <div id="toaster-wrap" class="abs" data-layout-allow-overflow style="width:150px;height:130px">
          <svg id="toast" class="abs" width="150" height="130" viewBox="0 0 150 130">
            <rect x="38" y="30" width="74" height="60" rx="14" fill="#e9b872" stroke="#3b2b25" stroke-width="4" />
            <rect x="48" y="40" width="54" height="40" rx="10" fill="#f6d9a4" />
          </svg>
          <svg id="toaster" class="abs" width="150" height="130" viewBox="0 0 150 130">
            <rect x="8" y="40" width="134" height="78" rx="20" fill="#8f98a8" stroke="#3b2b25" stroke-width="4" />
            <rect x="30" y="34" width="90" height="14" rx="7" fill="#3b2b25" />
            <rect x="140" y="62" width="10" height="26" rx="4" fill="#3b2b25" />
            <rect x="20" y="52" width="36" height="8" rx="4" fill="#fff" opacity=".35" />
            <ellipse cx="58" cy="80" rx="5" ry="6.5" fill="#2b1d18" />
            <ellipse cx="92" cy="80" rx="5" ry="6.5" fill="#2b1d18" />
            <path d="M68 94 q7 6 14 0" fill="none" stroke="#2b1d18" stroke-width="3.5" stroke-linecap="round" />
            <ellipse cx="44" cy="92" rx="7" ry="4" fill="#ff9a8a" opacity=".7" />
            <ellipse cx="106" cy="92" rx="7" ry="4" fill="#ff9a8a" opacity=".7" />
          </svg>
        </div>
        <div id="toaster-label" class="abs callout" style="left:1596px;top:946px;font-size:22px">script runs</div>
        <div id="puffs"></div>

        <!-- Mascot: the parser -->
        <div id="dots" class="abs" style="width:60px;height:12px">
          <div class="dot abs" style="left:0"></div><div class="dot abs" style="left:24px"></div><div class="dot abs" style="left:48px"></div>
        </div>
        <svg id="mascot" class="abs" width="120" height="130" viewBox="0 0 120 130">
          <g id="legs">
            <rect x="38" y="104" width="12" height="24" rx="5" fill="#3b2b25" />
            <rect x="70" y="104" width="12" height="24" rx="5" fill="#3b2b25" />
          </g>
          <line x1="60" y1="30" x2="63" y2="10" stroke="#3b2b25" stroke-width="4" stroke-linecap="round" />
          <circle cx="63" cy="9" r="6.5" fill="#e8503f" stroke="#3b2b25" stroke-width="3.5" />
          <rect x="14" y="28" width="92" height="84" rx="24" fill="#e8503f" stroke="#3b2b25" stroke-width="4" />
          <rect x="26" y="38" width="30" height="10" rx="5" fill="#fff" opacity=".35" />
          <g id="eyes">
            <ellipse cx="45" cy="68" rx="5.5" ry="7.5" fill="#2b1d18" />
            <ellipse cx="75" cy="68" rx="5.5" ry="7.5" fill="#2b1d18" />
            <circle cx="47" cy="65" r="2" fill="#fff" />
            <circle cx="77" cy="65" r="2" fill="#fff" />
          </g>
          <ellipse cx="32" cy="84" rx="8" ry="4.5" fill="#ff9a8a" opacity=".85" />
          <ellipse cx="88" cy="84" rx="8" ry="4.5" fill="#ff9a8a" opacity=".85" />
          <path d="M53 86 q7 7 14 0" fill="none" stroke="#2b1d18" stroke-width="3.5" stroke-linecap="round" />
        </svg>

        <!-- Chrome: scene title and chapter ring -->
        <div id="title" class="abs"></div>
        <div id="title-line" class="abs"></div>
        <svg id="ring" class="abs" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="24" fill="none" stroke="#e6d9c2" stroke-width="5" />
          <circle id="ring-arc" cx="32" cy="32" r="24" fill="none" stroke="#e5484d" stroke-width="5" stroke-linecap="round" transform="rotate(-90 32 32)" />
          <rect x="26" y="26" width="12" height="12" rx="3" fill="#e5484d" />
        </svg>
        <div id="ring-label" class="abs">2 · parse</div>
      </div>
    </div>

    <script>
      const W = 1920, H = 1080, DUR = 6;
      const INK = "#3b2b25";

      // ---------- seeded randomness (no Math.random) ----------
      function hash(a, b, c) {
        let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }

      // ---------- the DOM tree, shared by canvas and labels ----------
      const N = {
        html:   { x: 960,  y: 250, label: "<html>" },
        head:   { x: 620,  y: 400, label: "<head>" },
        body:   { x: 1300, y: 400, label: "<body>" },
        title:  { x: 470,  y: 560, label: "<title>" },
        link:   { x: 700,  y: 560, label: "<link>" },
        h1:     { x: 1020, y: 560, label: "<h1>" },
        p:      { x: 1180, y: 560, label: "<p>" },
        img:    { x: 1370, y: 560, label: "<img>" },
        script: { x: 1580, y: 560, label: "<script>" },
        div:    { x: 1790, y: 560, label: "<div>" },
        t1:     { x: 1020, y: 720, label: "#text", text: true },
        t2:     { x: 1180, y: 720, label: "#text", text: true },
      };
      const BASKET = { x: 960, y: 120 };

      // Each branch grows from `from` to `to` starting at `s` for `d` seconds.
      const branches = [
        { from: BASKET, to: N.html, s: 0.0, d: 0.35, droop: 0 },
        { from: N.html, to: N.head, s: 0.25, d: 0.5 },
        { from: N.html, to: N.body, s: 0.3, d: 0.5 },
        { from: N.head, to: N.title, s: 0.7, d: 0.45 },
        { from: N.head, to: N.link, s: 0.75, d: 0.45 },
        { from: N.body, to: N.h1, s: 0.8, d: 0.45 },
        { from: N.body, to: N.p, s: 0.85, d: 0.45 },
        { from: N.body, to: N.img, s: 0.9, d: 0.45 },
        { from: N.h1, to: N.t1, s: 1.2, d: 0.35, droop: 0 },
        { from: N.p, to: N.t2, s: 1.25, d: 0.35, droop: 0 },
        { from: N.body, to: N.script, s: 1.8, d: 0.45 },
        { from: N.body, to: N.div, s: 4.25, d: 0.5 },
        // untagged tendrils that frame the tree
        { from: N.head, to: { x: 150, y: 1100 }, s: 0.7, d: 1.4, tendril: true },
        { from: N.title, to: { x: 430, y: 1100 }, s: 1.1, d: 1.2, tendril: true },
        { from: N.link, to: { x: 730, y: 1000 }, s: 1.15, d: 1.0, tendril: true },
        { from: N.img, to: { x: 1400, y: 900 }, s: 1.3, d: 0.9, tendril: true },
      ];

      function ctrl(b) {
        const { from: a, to: c } = b;
        const dx = c.x - a.x;
        if (b.tendril) {
          return [
            { x: a.x + dx * 0.55, y: a.y - 30 },
            { x: c.x + 60, y: a.y + (c.y - a.y) * 0.45 },
          ];
        }
        if (b.droop === 0) return [{ x: a.x, y: a.y + 40 }, { x: c.x, y: c.y - 40 }];
        // arch up and out, then down into the child
        return [
          { x: a.x + dx * 0.3, y: a.y - 55 },
          { x: c.x - dx * 0.02, y: a.y - 25 },
        ];
      }
      function bez(p0, p1, p2, p3, t) {
        const u = 1 - t;
        return {
          x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
          y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
        };
      }
      const easeOut = (x) => 1 - Math.pow(1 - x, 3);
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };

      // ---------- static paper grain, generated once from a seed ----------
      const grain = document.createElement("canvas");
      grain.width = W / 2; grain.height = H / 2;
      {
        const g = grain.getContext("2d");
        const img = g.createImageData(grain.width, grain.height);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = hash(i, 7, 11) * 255;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        g.putImageData(img, 0, 0);
      }

      // ---------- per-frame canvas painter: frame = f(t) ----------
      const ctx = document.getElementById("paper").getContext("2d");

      function drawLeaf(x, y, ang, size, tone) {
        if (size <= 0.01) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        ctx.scale(size, size);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(10, -12, 26, 0);
        ctx.quadraticCurveTo(10, 12, 0, 0);
        ctx.fillStyle = tone ? "#7fae5a" : "#6a9c4a";
        ctx.fill();
        ctx.lineWidth = 2.5 / size;
        ctx.strokeStyle = "#3f5f2c";
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(2, 0); ctx.lineTo(20, 0);
        ctx.lineWidth = 1.5 / size;
        ctx.stroke();
        ctx.restore();
      }

      function drawFlower(x, y, s, t) {
        if (s <= 0.01) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(t * 1.6) * 0.1);
        ctx.scale(s, s);
        for (let i = 0; i < 5; i++) {
          ctx.rotate((Math.PI * 2) / 5);
          ctx.beginPath();
          ctx.ellipse(0, -11, 7, 10, 0, 0, Math.PI * 2);
          ctx.fillStyle = "#f59aa8";
          ctx.fill();
          ctx.lineWidth = 2.2;
          ctx.strokeStyle = INK;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#f2c14e";
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawBasket(t) {
        const { x, y } = BASKET;
        ctx.strokeStyle = INK;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x, -10); ctx.lineTo(x - 50, y - 30);
        ctx.moveTo(x, -10); ctx.lineTo(x + 50, y - 30);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 62, y - 32);
        ctx.lineTo(x + 62, y - 32);
        ctx.lineTo(x + 44, y + 12);
        ctx.lineTo(x - 44, y + 12);
        ctx.closePath();
        ctx.fillStyle = "#9a6a43";
        ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#6e4527";
        for (let i = 0; i < 3; i++) {
          const yy = y - 20 + i * 11;
          ctx.beginPath(); ctx.moveTo(x - 56 + i * 5, yy); ctx.lineTo(x + 56 - i * 5, yy); ctx.stroke();
        }
        for (let i = 0; i < 5; i++) {
          drawLeaf(x - 60 + i * 30, y - 34, -Math.PI / 2 + (i - 2) * 0.5 + Math.sin(t * 2 + i) * 0.06, 1.1, i % 2);
        }
      }

      function draw(t) {
        ctx.clearRect(0, 0, W, H);

        // diagonal stripes, drifting slowly
        ctx.fillStyle = "#f3ead6";
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.rotate(-0.6);
        ctx.fillStyle = "#dfe9d0";
        const off = (t * 18) % 200;
        for (let k = -16; k < 16; k++) ctx.fillRect(k * 200 + off, -1400, 90, 2800);
        ctx.restore();

        ctx.globalAlpha = 0.05;
        ctx.drawImage(grain, 0, 0, W, H);
        ctx.globalAlpha = 1;

        // hand-drawn "boil": geometry re-jitters 8 times a second, not every frame
        const boil = Math.floor(t * 8);

        branches.forEach((b, bi) => {
          const p = easeOut(clamp01((t - b.s) / b.d));
          if (p <= 0) return;
          const [c1, c2] = ctrl(b);
          const steps = 48;
          const pts = [];
          for (let i = 0; i <= steps; i++) {
            const u = (i / steps) * p;
            const q = bez(b.from, c1, c2, b.to, u);
            const j = i === 0 ? 0 : 1.3;
            q.x += (hash(bi, i, boil) - 0.5) * j;
            q.y += (hash(bi, i + 99, boil) - 0.5) * j;
            pts.push(q);
          }
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
          ctx.strokeStyle = INK;
          ctx.lineWidth = b.tendril ? 6 : 8;
          ctx.stroke();
          ctx.strokeStyle = "#7a5638";
          ctx.lineWidth = b.tendril ? 2.5 : 4;
          ctx.stroke();

          // leaves sprout once the vine has passed them
          const spots = b.tendril ? [0.15, 0.3, 0.45, 0.6, 0.75, 0.9] : [0.35, 0.65, 0.88];
          spots.forEach((f, li) => {
            const grow = smooth((p - f) / 0.18);
            if (grow <= 0) return;
            const q0 = bez(b.from, c1, c2, b.to, f);
            const q1 = bez(b.from, c1, c2, b.to, f + 0.01);
            const tan = Math.atan2(q1.y - q0.y, q1.x - q0.x);
            const side = li % 2 ? 1 : -1;
            const sway = Math.sin(t * 2.2 + bi + li) * 0.08;
            drawLeaf(q0.x, q0.y, tan + side * 1.0 + sway, grow * 1.15, (bi + li) % 2);
          });
        });

        drawBasket(t);

        // flowers bloom on the text nodes
        drawFlower(N.t1.x, N.t1.y - 44, smooth((t - 1.55) / 0.35), t);
        drawFlower(N.t2.x, N.t2.y - 44, smooth((t - 1.62) / 0.35), t + 1);
      }

      // ---------- DOM labels ----------
      const tags = document.getElementById("tags");
      const tagEls = {};
      for (const [k, n] of Object.entries(N)) {
        const el = document.createElement("div");
        el.className = "tag" + (n.text ? " text" : "");
        el.textContent = n.label;
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";
        tags.appendChild(el);
        tagEls[k] = el;
      }

      // title characters, revealed one by one
      const TITLE = "scripts can pause the parser";
      const titleEl = document.getElementById("title");
      const chars = [...TITLE].map((c) => {
        const s = document.createElement("span");
        s.textContent = c;
        titleEl.appendChild(s);
        return s;
      });

      // puffs of steam, fixed pattern
      const puffs = document.getElementById("puffs");
      const puffEls = [0, 1, 2, 3, 4, 5].map((i) => {
        const el = document.createElement("div");
        el.className = "puff abs";
        el.style.left = 1622 + [0, 34, -20, 22, -8, 30][i] + "px";
        el.style.top = "808px";
        puffs.appendChild(el);
        return el;
      });

      // ---------- timeline ----------
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // the canvas is a pure function of timeline time
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);

      // chrome
      chars.forEach((c, i) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.1 + i * 0.022));
      tl.fromTo("#title-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.55);
      const ARC = 2 * Math.PI * 24;
      gsap.set("#ring-arc", { attr: { "stroke-dasharray": ARC } });
      tl.fromTo("#ring-arc", { attr: { "stroke-dashoffset": ARC * 0.84 } }, { attr: { "stroke-dashoffset": ARC * 0.66 }, duration: DUR, ease: "none" }, 0);

      // labels pop when their vine arrives
      tl.fromTo(tagEls.html, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.28);
      branches.forEach((b) => {
        const key = Object.keys(N).find((k) => N[k] === b.to);
        if (!key || key === "html") return;
        tl.fromTo(tagEls[key], { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, b.s + b.d * 0.8);
      });

      // mascot: foot point is the transform origin
      const m = "#mascot";
      const perch = (n) => ({ x: n.x - 60, y: n.y - 20 - 130 });
      gsap.set(m, { transformOrigin: "50% 100%" });
      const onBody = perch(N.body), onScript = perch(N.script), onDiv = perch(N.div);
      tl.fromTo(m, { x: onBody.x, y: -200 }, { y: onBody.y, duration: 0.35, ease: "power2.in" }, 1.0);
      tl.fromTo(m, { scaleX: 1, scaleY: 1 }, { scaleX: 1.2, scaleY: 0.78, duration: 0.08, ease: "power1.out" }, 1.35);
      tl.to(m, { scaleX: 1, scaleY: 1, duration: 0.35, ease: "elastic.out(1.2, 0.4)" }, 1.43);
      tl.to("#eyes", { scaleY: 0.1, transformOrigin: "50% 60%", duration: 0.06, yoyo: true, repeat: 1 }, 1.7);

      function hop(from, to, at, height, dur = 0.5) {
        tl.to(m, { scaleX: 1.12, scaleY: 0.85, duration: 0.1, ease: "power1.out" }, at - 0.1); // anticipation
        tl.to(m, { scaleX: 0.92, scaleY: 1.1, duration: 0.12 }, at);
        tl.to(m, { x: to.x, duration: dur, ease: "none" }, at);
        tl.to(m, { y: Math.min(from.y, to.y) - height, duration: dur / 2, ease: "power2.out" }, at);
        tl.to(m, { y: to.y, duration: dur / 2, ease: "power2.in" }, at + dur / 2);
        tl.to(m, { rotation: to.x > from.x ? 12 : -12, duration: dur / 2, ease: "sine.out" }, at);
        tl.to(m, { rotation: 0, duration: dur / 2, ease: "sine.in" }, at + dur / 2);
        tl.to(m, { scaleX: 1.2, scaleY: 0.78, duration: 0.07 }, at + dur);
        tl.to(m, { scaleX: 1, scaleY: 1, duration: 0.35, ease: "elastic.out(1.2, 0.4)" }, at + dur + 0.07);
      }
      hop(onBody, onScript, 2.15, 90);

      // parser paused: badge, callout, waiting dots
      tl.fromTo("#badge", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.7);
      gsap.set("#callout-line", { attr: { "stroke-dasharray": "6 8" } });
      tl.fromTo("#callout-line", { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "power2.out" }, 2.75);
      tl.fromTo("#callout-paused", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25 }, 2.9);
      tl.fromTo("#callout-resumes", { opacity: 0, y: 8 }, { opacity: 0, y: 8, duration: 0.01 }, 0);
      gsap.set("#dots", { x: onScript.x + 30, y: onScript.y - 26 });
      tl.fromTo("#dots", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.95);
      document.querySelectorAll("#dots .dot").forEach((d, i) => {
        tl.fromTo(d, { y: 0 }, { y: -10, duration: 0.2, yoyo: true, repeat: 5, ease: "sine.inOut" }, 3.0 + i * 0.1);
      });

      // toaster slides in, shakes, puffs, pops toast
      gsap.set("#toaster-wrap", { transformOrigin: "50% 100%" });
      tl.fromTo("#toaster-wrap", { x: 2000, y: 820 }, { x: 1590, duration: 0.45, ease: "back.out(1.4)" }, 2.75);
      tl.fromTo("#toaster-label", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 3.0);
      tl.fromTo("#toaster", { rotation: -2.5 }, { rotation: 2.5, duration: 0.07, yoyo: true, repeat: 11, ease: "sine.inOut", transformOrigin: "50% 100%" }, 3.2);
      puffEls.forEach((el, i) => {
        const at = 3.2 + i * 0.13;
        tl.fromTo(el, { opacity: 0, scale: 0.2, y: 0 }, { opacity: 1, scale: 0.8 + (i % 3) * 0.15, y: -30, duration: 0.25, ease: "power2.out" }, at);
        tl.to(el, { opacity: 0, y: -110 - (i % 3) * 20, scale: 1.2, duration: 0.5, ease: "power1.in" }, at + 0.25);
      });
      tl.fromTo("#toast", { y: 0 }, { y: -58, duration: 0.25, ease: "back.out(3)" }, 4.05);

      // parser resumes
      tl.to("#badge", { scale: 0, duration: 0.2, ease: "back.in(2)" }, 4.15);
      tl.to("#dots", { opacity: 0, duration: 0.15 }, 4.1);
      tl.to("#callout-paused", { opacity: 0, y: -8, duration: 0.2 }, 4.2);
      tl.to("#callout-resumes", { opacity: 1, y: 0, duration: 0.25 }, 4.3);
      tl.to("#toaster-wrap", { x: 2000, duration: 0.4, ease: "back.in(1.4)" }, 4.9);
      tl.to("#toaster-label", { opacity: 0, duration: 0.2 }, 4.85);
      hop(onScript, onDiv, 4.75, 80);
      tl.to(m, { y: onDiv.y - 30, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 5.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
      draw(0);
    </script>
