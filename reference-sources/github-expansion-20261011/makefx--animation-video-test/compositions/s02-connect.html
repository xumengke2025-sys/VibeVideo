<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s02-root { position: absolute; inset: 0; }
        #s02-term { left: 110px; top: 310px; width: 900px; height: 330px; }
        #s02-head { position: absolute; left: 28px; top: 24px; display: flex; gap: 10px; align-items: center; }
        #s02-head i { width: 13px; height: 13px; border-radius: 50%; background: var(--k-ink-4); display: block; }
        #s02-head span { margin-left: 14px; }
        #s02-body { position: absolute; left: 40px; top: 96px; right: 40px; font: 500 32px/1.75 var(--k-mono); color: var(--k-ink); }
        #s02-body > div:not(.k-abs) { position: relative; white-space: pre; }
        .s02-dim { color: var(--k-ink-3); }
        .s02-caret { display: inline-block; width: 18px; height: 38px; background: var(--k-ink); vertical-align: -7px; margin-left: 2px; }
        #s02-hl { background: var(--k-accent-tint); border-radius: 8px; transform-origin: 0 50%; box-shadow: inset 0 0 0 1.5px var(--k-accent-soft); }
        #s02-node { left: 1250px; top: 370px; width: 560px; height: 150px; }
        #s02-node-name { left: 28px; top: 28px; font: 600 36px/1 var(--k-display); letter-spacing: -0.02em; color: var(--k-ink); }
        #s02-node-name b { color: var(--k-accent); font-weight: 600; }
        #s02-node-url { left: 28px; top: 88px; font-size: 22px; color: var(--k-ink-2); }
        #s02-on { left: auto; right: 24px; top: 26px; font-size: 18px; }
        #s02-on b { color: var(--k-ok); font-weight: 500; }
        #s02-sign { left: 1250px; top: 570px; width: 560px; height: 300px; }
        #s02-sign-head { left: 28px; top: 26px; }
        #s02-btn { left: 28px; top: 68px; display: flex; align-items: center; gap: 14px; padding: 10px 26px 10px 12px; font-size: 26px; }
        #s02-g { width: 36px; height: 36px; border-radius: 50%; background: var(--k-ink); color: var(--k-void); font: 600 22px/36px var(--k-display); text-align: center; }
        #s02-done { left: 28px; top: 68px; display: flex; align-items: center; gap: 12px; padding: 12px 24px 12px 16px; font: 600 26px/1 var(--k-display); color: var(--k-ink); }
        #s02-keys-head { left: 28px; top: 170px; }
        #s02-field { left: 28px; top: 204px; width: 504px; height: 64px; border-radius: 10px; background: var(--k-surface-field); box-shadow: inset 0 0 0 1.5px var(--k-line); }
        #s02-none { left: 14px; top: 13px; font-size: 22px; padding: 6px 16px; }
      </style>
      <div id="s02-root" data-composition-id="s02-connect" data-width="1920" data-height="1080">
        <div id="s02-scene" class="k-scene">
          <div id="s02-term" class="k-panel">
            <div id="s02-head"><i></i><i></i><i></i><span class="k-micro">agent · ~/launch</span></div>
            <div id="s02-body">
              <div id="s02-hl" class="k-abs"></div>
              <div class="s02-dim"># add makefx to your agent, once</div>
              <div>$ <span id="s02-cmd"></span><span id="s02-caret-a" class="s02-caret"></span></div>
              <div>    <span id="s02-url"></span><span id="s02-caret-b" class="s02-caret"></span></div>
            </div>
          </div>
          <div id="s02-node" class="k-panel">
            <div id="s02-node-name" class="k-abs">make<b>fx</b></div>
            <div id="s02-node-url" class="k-abs k-mono">makefx.app/mcp · http</div>
            <div id="s02-on" class="k-chip"><b>●</b> connected</div>
          </div>
          <div id="s02-sign" class="k-panel">
            <div id="s02-sign-head" class="k-abs k-micro">makefx.app · oauth 2.1</div>
            <div id="s02-btn" class="k-button"><div id="s02-g">G</div><span>Sign in with Google</span></div>
            <div id="s02-done" class="k-pill">
              <svg width="30" height="30" viewBox="0 0 30 30"><path id="s02-tick" d="M6 16 L12 22 L24 8" fill="none" stroke="#7bd389" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>
              <span>Signed in with Google</span>
            </div>
            <div id="s02-keys-head" class="k-abs k-micro">provider keys</div>
            <div id="s02-field" class="k-abs"><div id="s02-none" class="k-pill k-amber">none needed</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const scene = document.getElementById("s02-scene");
          K.chrome(scene, tl, { title: "One command connects", step: 1, animateStep: false });

          // Terminal geometry: 32 px mono (19.2 px a cell), 56 px lines, text from x 150, lines from y 406.
          const CELL = 32 * 0.6, LH = 56, X = 150, lineY = (i) => 406 + LH / 2 + i * LH;
          const CMD = "claude mcp add --transport http \\", URL = "makefx https://makefx.app/mcp";
          const cmdX = X + 2 * CELL, urlX = X + 4 * CELL, cmdEnd = cmdX + CMD.length * CELL, urlEnd = urlX + URL.length * CELL;
          // The highlight covers both lines of the command once it runs.
          Object.assign(document.getElementById("s02-hl").style, { left: cmdX - X - 10 + "px", top: LH + 4 + "px", width: cmdEnd - cmdX + 20 + "px", height: 2 * LH - 8 + "px" });

          // The one line from the agent to makefx, drawn when the command runs.
          const link = K.edge(scene, "M1010 520 C 1130 520, 1130 445, 1250 445", { alpha: 0.5 });
          const node = document.getElementById("s02-node");
          gsap.set("#s02-on", { opacity: 0 });
          gsap.set("#s02-done", { opacity: 0 });
          gsap.set("#s02-none", { opacity: 0 });
          gsap.set("#s02-caret-b", { opacity: 0 });

          // b0–b1: the add command types itself in the agent's terminal
          K.type(tl, document.getElementById("s02-cmd"), CMD, 0, 0.45);
          // b2: the name and the url
          tl.set("#s02-caret-a", { opacity: 0, data: "follow" }, K.t(2));
          tl.set("#s02-caret-b", { opacity: 1, data: "follow" }, K.t(2));
          K.type(tl, document.getElementById("s02-url"), URL, 2, 0.2);
          // b3: enter; the command lights
          tl.fromTo("#s02-hl", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.16, ease: K.ease }, K.t(3));
          tl.to("#s02-caret-b", { opacity: 0, duration: 0.05, data: "follow" }, K.t(3));
          // b4: a line runs from the agent to makefx; makefx answers, connected
          K.draw(tl, link, 4, 0.2, "power2.in");
          tl.to("#s02-hl", { opacity: 0, duration: 0.16, data: "follow" }, K.t(4)); // amber leaves with the focus
          tl.to(node, { boxShadow: "0 0 0 2.5px #f2c14e, 0 24px 64px -24px rgba(0,0,0,.9)", duration: 0.06, data: "follow" }, K.t(4) + 0.2);
          tl.set("#s02-on", { opacity: 1, data: "follow" }, K.t(4) + 0.2);
          tl.to(node, { boxShadow: "0 0 0 1.5px rgba(255,255,255,.24), 0 24px 64px -24px rgba(0,0,0,.9)", duration: 0.2, data: "follow" }, K.t(5) - 0.02);
          // b5: makefx asks who you are: OAuth 2.1, sign in with Google
          K.pop(tl, "#s02-sign", 5);
          // b6: pressed once; a check, signed in
          tl.fromTo("#s02-btn", { scale: 1 }, { scale: 0.95, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.out" }, K.t(6));
          tl.set("#s02-btn", { opacity: 0, data: "follow" }, K.t(6) + 0.12);
          tl.set("#s02-done", { opacity: 1, data: "follow" }, K.t(6) + 0.12);
          const tick = document.getElementById("s02-tick"), TL = tick.getTotalLength();
          tick.setAttribute("stroke-dasharray", `${TL} ${TL}`);
          tl.fromTo(tick, { attr: { "stroke-dashoffset": TL } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.12, ease: "power2.out", data: "follow" }, K.t(6) + 0.12);
          // b7: the provider-keys field stays empty: none needed
          K.pop(tl, "#s02-none", 7, { y: 8 });

          const SIGN = 570, btnY = SIGN + 68 + 29;
          K.focus(scene, tl, "s02", [
            [0, cmdX + 180, lineY(1)], [1, cmdEnd - 120, lineY(1)], [2, urlX + 330, lineY(2)], [3, urlEnd, lineY(2) - 20],
            [4, 1130, 482], [5, 1250 + 28 + 170, btnY], [6, 1250 + 28 + 170, btnY], [7, 1250 + 28 + 14 + 90, SIGN + 204 + 32],
          ]);
          K.check(tl, "s02");
          window.__timelines["s02-connect"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
