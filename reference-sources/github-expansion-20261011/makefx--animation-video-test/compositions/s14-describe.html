<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s14-root { position: absolute; inset: 0; }
        /* The read panel, anchored to the selected still. */
        #s14-panel { left: 1060px; top: 560px; width: 770px; height: 340px; }
        #s14-tlabel { left: 28px; top: 24px; }
        #s14-field { left: 28px; top: 58px; width: 714px; height: 110px; border-radius: 10px; background: var(--k-surface-field); box-shadow: inset 0 0 0 1.5px var(--k-line); }
        #s14-traits { left: 20px; top: 36px; font: 500 30px/1.2 var(--k-mono); color: var(--k-ink); white-space: pre; }
        #s14-empty { left: 20px; top: 40px; font: 500 22px/1.2 var(--k-mono); color: var(--k-ink-4); white-space: pre; }
        #s14-caret { display: inline-block; width: 3px; height: 34px; margin-left: 4px; vertical-align: -6px; background: var(--k-ink); }
        #s14-row { left: 28px; top: 230px; width: 714px; height: 48px; }
        #s14-btn { left: 0; top: 0; font-size: 24px; padding: 12px 24px; }
        #s14-line { left: auto; right: 0; top: 13px; font: 500 22px/1 var(--k-mono); color: var(--k-ink-3); white-space: nowrap; }
        /* The agent's terminal, where the next prompt is written. */
        #s14-term { left: 1060px; top: 220px; width: 770px; height: 290px; }
        #s14-head { position: absolute; left: 28px; top: 24px; display: flex; gap: 10px; align-items: center; }
        #s14-head i { width: 13px; height: 13px; border-radius: 50%; background: var(--k-ink-4); display: block; }
        #s14-head span { margin-left: 14px; }
        #s14-body { position: absolute; left: 36px; top: 76px; right: 36px; font: 500 26px/1.7 var(--k-mono); color: var(--k-ink-2); white-space: pre; }
        #s14-fill { position: relative; display: inline-block; color: var(--k-ink); }
        #s14-hl { left: -8px; top: 3px; right: -8px; bottom: 3px; background: var(--k-accent-tint); border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--k-accent-soft); }
        #s14-pcaret { display: inline-block; width: 16px; height: 34px; background: var(--k-ink); vertical-align: -7px; margin-left: 2px; }
        #s14-slip { font-size: 24px; padding: 6px 14px; }
        #s14-charge { font-size: 20px; padding: 6px 14px; }
      </style>
      <div id="s14-root" data-composition-id="s14-describe" data-width="1920" data-height="1080">
        <div id="s14-scene" class="k-scene">
          <div id="s14-term" class="k-panel">
            <div id="s14-head"><i></i><i></i><i></i><span class="k-micro">agent · next prompt</span></div>
            <div id="s14-body"><div>$ claude</div><div>&gt; <span style="color:var(--k-ink)">the keeper waves from the pier,</span></div><div>  <span id="s14-fill"><span id="s14-hl" class="k-abs"></span><span id="s14-text" style="position:relative">red scarf, round glasses</span></span><span id="s14-pcaret"></span></div></div>
          </div>
          <div id="s14-panel" class="k-panel">
            <div id="s14-tlabel" class="k-abs k-micro">Traits · editable</div>
            <div id="s14-field" class="k-abs">
              <div id="s14-empty" class="k-abs">no traits yet</div>
              <div id="s14-traits" class="k-abs"><span id="s14-t1"></span><span id="s14-t2"></span><span id="s14-caret"></span></div>
            </div>
            <div id="s14-row" class="k-abs">
              <div id="s14-btn" class="k-button">Describe · 2 credits</div>
              <div id="s14-line" class="k-abs">2 credits · balance after 1,918</div>
            </div>
          </div>
          <div id="s14-slip" class="k-pill k-amber">red scarf, round glasses</div>
          <div id="s14-charge" class="k-pill k-amber">2 cr</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const scene = document.getElementById("s14-scene");

          // The character still: a harbour keeper, drawn as media (rich, flat, gradients).
          const keeper = `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="s14-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec5e6"/><stop offset="1" stop-color="#d8ecf5"/></linearGradient>
              <linearGradient id="s14-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7fb0"/><stop offset="1" stop-color="#1f4f78"/></linearGradient>
              <radialGradient id="s14-glow"><stop offset="0" stop-color="rgba(255,214,107,.5)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></radialGradient>
              <linearGradient id="s14-coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f6096"/><stop offset="1" stop-color="#1c2a47"/></linearGradient>
              <linearGradient id="s14-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d6b0"/><stop offset="1" stop-color="#e5a97e"/></linearGradient>
              <linearGradient id="s14-cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34507e"/><stop offset="1" stop-color="#18233d"/></linearGradient>
              <linearGradient id="s14-scarf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4705e"/><stop offset="1" stop-color="#bf3529"/></linearGradient>
            </defs>
            <rect width="320" height="124" fill="url(#s14-sky)"/>
            <circle cx="56" cy="40" r="52" fill="url(#s14-glow)"/><circle cx="56" cy="40" r="13" fill="#ffd66b"/>
            <path d="M190 116 Q230 100 270 110 T320 106 L320 124 L190 124 Z" fill="#2f4a5a" opacity=".85"/>
            <rect y="122" width="320" height="58" fill="url(#s14-sea)"/>
            <path d="M258 122 L261 70 L273 70 L276 122 Z" fill="#f4efe6"/><rect x="259" y="84" width="16" height="8" fill="#e0574a"/><rect x="258" y="102" width="18" height="8" fill="#e0574a"/>
            <path d="M256 70 H278 L273 61 H261 Z" fill="#2b2b33"/><circle cx="267" cy="59" r="4" fill="#f4efe6"/>
            <path d="M14 150 q14 -4 28 0 t28 0 M236 164 q14 -4 28 0 t28 0" stroke="rgba(255,255,255,.22)" stroke-width="2" fill="none"/>
            <path d="M84 180 C 88 146, 112 132, 150 130 C 188 132, 212 146, 216 180 Z" fill="url(#s14-coat)"/>
            <path d="M150 140 V180" stroke="rgba(255,255,255,.14)" stroke-width="3"/>
            <circle cx="142" cy="156" r="2.6" fill="#d9c27a"/><circle cx="142" cy="170" r="2.6" fill="#d9c27a"/>
            <path d="M139 104 H161 V128 H139 Z" fill="#dc9d72"/>
            <ellipse cx="122" cy="90" rx="6" ry="9" fill="#e9b088"/><ellipse cx="178" cy="90" rx="6" ry="9" fill="#e9b088"/>
            <ellipse cx="150" cy="87" rx="28" ry="32" fill="url(#s14-skin)"/>
            <path d="M123 78 Q124 94 128 100 L124 100 Q120 88 121 78 Z M177 78 Q176 94 172 100 L176 100 Q180 88 179 78 Z" fill="#c9ccd2"/>
            <circle cx="133" cy="101" r="5" fill="#f08a7a" opacity=".35"/><circle cx="167" cy="101" r="5" fill="#f08a7a" opacity=".35"/>
            <path d="M149 94 Q146 102 151 103" stroke="#c98a62" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <path d="M141 110 Q150 116 159 110" stroke="#a84c3c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M131 80 Q138 76 145 80 M155 80 Q162 76 169 80" stroke="#8a8f99" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <circle cx="138" cy="90" r="2.6" fill="#1b1b22"/><circle cx="162" cy="90" r="2.6" fill="#1b1b22"/>
            <circle cx="138" cy="90" r="10" fill="rgba(220,240,250,.28)" stroke="#1b1b22" stroke-width="3"/>
            <circle cx="162" cy="90" r="10" fill="rgba(220,240,250,.28)" stroke="#1b1b22" stroke-width="3"/>
            <path d="M148 89 Q150 86 152 89 M128 88 L123 86 M172 88 L177 86" stroke="#1b1b22" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M120 70 Q121 40 150 38 Q179 40 180 70 Z" fill="url(#s14-cap)"/>
            <path d="M113 68 H187 Q190 77 181 78 H119 Q110 77 113 68 Z" fill="#131b30"/>
            <circle cx="150" cy="56" r="4.5" fill="#d9c27a"/>
            <path d="M114 122 Q150 138 186 122 L190 136 Q150 154 110 136 Z" fill="url(#s14-scarf)"/>
            <path d="M156 136 L170 176 L150 172 L146 140 Z" fill="url(#s14-scarf)"/>
            <path d="M120 128 Q150 141 180 128 M155 150 L165 170" stroke="rgba(255,255,255,.22)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;

          // The space so far, at rest on the canvas.
          K.card(scene, { id: "s14-quay", left: 130, top: 250, scale: 1.3, art: K.harbourArt({ boat: -20 }), name: "quay at low tide", cr: "3 cr" });
          K.card(scene, { id: "s14-flight", left: 130, top: 590, scale: 1.3, art: K.harbourArt({ boat: 12 }), name: "harbour flight", cr: "80 cr" });

          // The character still, selected: the read panel hangs off its right edge.
          const card = K.card(scene, { id: "s14-card", left: 470, top: 560, scale: 2.2, art: keeper, name: "harbour keeper", cr: "3 cr", state: "selected" });
          const C = card.k;

          const panel = document.getElementById("s14-panel"), row = document.getElementById("s14-row");
          const slip = document.getElementById("s14-slip"), charge = document.getElementById("s14-charge");
          [slip, charge].forEach((e) => scene.appendChild(e)); // travel above everything

          // Media art bleeds past its viewBox by design; the thumb clips it.
          scene.querySelectorAll(".k-thumb svg, .s15-fr svg").forEach((s) => s.setAttribute("data-layout-allow-overflow", ""));
          K.chrome(scene, tl, { title: "Describe keeps the traits", step: 5, balance: "1,920 cr" });

          // Scene geometry for the moving parts.
          const BTN = { x: 1060 + 28 + 135, y: 560 + 230 + 24 }; // Describe button centre
          const BAL = { x: 1773, y: 1013 }; // the balance pill
          const CELL = 30 * 0.6, TX = 1060 + 28 + 20, TY = 560 + 58 + 55; // traits text start, mid-line
          const PX = 1060 + 36 + 2 * 26 * 0.6, PY = 220 + 76 + 26 * 1.7 * 2.5; // prompt fill start, mid-line
          const svg = K.el(scene, "svg", { class: "k-abs", width: 1920, height: 1080, style: { pointerEvents: "none" } });
          const line = (d) => K.el(svg, "path", { d, fill: "none", stroke: "none" });

          // b0: the still lands on the canvas: a keeper, red scarf, round glasses
          K.reveal(tl, card, 0);
          // b1: Describe is pressed; the field waits for the answer
          const btn = document.getElementById("s14-btn");
          tl.fromTo(btn, { scale: 1 }, { scale: 0.96, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.out" }, K.t(1));
          tl.fromTo(btn, { opacity: 1 }, { opacity: 0.55, duration: 0.1, data: "follow" }, K.t(1) + 0.08);
          // b2: 2 cr leaves for the balance, which ticks to 1,918
          const toBal = line(`M${BTN.x + 100} ${BTN.y} C ${BTN.x + 320} ${BTN.y + 10}, ${BAL.x - 60} ${BAL.y - 90}, ${BAL.x - 40} ${BAL.y}`);
          tl.fromTo(charge, { opacity: 0 }, { opacity: 1, duration: 0.04 }, K.t(2));
          K.travel(tl, charge, toBal, 2, 0.14, K.easeMove, 64, 34);
          tl.to(charge, { opacity: 0, duration: 0.04, data: "follow" }, K.t(2) + 0.12);
          K.balance(tl, scene, K.t(2) + 0.125, { balance: "1,918 cr" });
          // b3: the traits write themselves onto the asset; the Describe row has done its job
          tl.to("#s14-empty", { opacity: 0, duration: 0.04, data: "follow" }, K.t(3));
          tl.to(row, { opacity: 0, duration: 0.12, data: "follow" }, K.t(3));
          K.type(tl, document.getElementById("s14-t1"), "red scarf,", 3, 0.2);
          // b4: the second trait; the field is left editable, caret at the end
          K.type(tl, document.getElementById("s14-t2"), " round glasses", 4, 0.2);
          // b5: the traits leave the field for the next prompt
          const toPrompt = line(`M${TX + 190} ${TY} C ${TX + 190} ${TY - 140}, ${PX + 190} ${PY + 140}, ${PX + 190} ${PY}`);
          tl.fromTo(slip, { opacity: 0 }, { opacity: 1, duration: 0.04 }, K.t(5));
          K.travel(tl, slip, toPrompt, 5, 0.22, K.easeMove, 380, 42);
          tl.to(slip, { opacity: 0, duration: 0.04, data: "follow" }, K.t(6));
          // b6: they land in the prompt, lit
          tl.fromTo("#s14-fill", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.12, ease: "power2.out" }, K.t(6));
          tl.fromTo("#s14-pcaret", { x: -390 }, { x: 0, duration: 0.12, ease: "power2.out", data: "follow" }, K.t(6));
          // b7: the light settles; the prompt is ready to send
          tl.to("#s14-hl", { opacity: 0.35, duration: 0.24, ease: "power1.out" }, K.t(7));

          K.focus(scene, tl, "s14", [
            [0, C.cx, C.mediaCy], [1, BTN.x, BTN.y], [2, BAL.x, BAL.y], [3, TX + 10 * CELL, TY],
            [4, TX + 20 * CELL, TY], [5, PX + 190, PY], [6, PX + 190, PY], [7, PX + 200, PY],
          ]);
          K.check(tl, "s14");
          window.__timelines["s14-describe"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
